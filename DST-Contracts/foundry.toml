[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
optimizer = true
runs = 200
via_ir = true
solc_version = "0.8.20"

# Use Sourcify for verification so no explorer API keys are needed
verifier = "sourcify"

[rpc_endpoints]
base_sepolia = "https://base-sepolia.g.alchemy.com/v2/${RPC_API_KEY}"
op_sepolia = "https://opt-sepolia.g.alchemy.com/v2/${RPC_API_KEY}"
base = "https://base-mainnet.g.alchemy.com/v2/${RPC_API_KEY}"
celo = "https://celo-mainnet.g.alchemy.com/v2/${RPC_API_KEY}"